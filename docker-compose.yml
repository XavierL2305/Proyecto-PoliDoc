services:
  # 1. RabbitMQ (Message Broker / Cola de Mensajes)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: polidoc_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Puerto para Celery
      - "15672:15672" # Panel web visual (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 250M

  # 2. Redis (Result Backend / Memoria RAM)
  redis:
    image: redis:7-alpine
    container_name: polidoc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. MongoDB (Base de datos NoSQL para Logs de Auditoría ISO)
  mongodb:
    image: mongo:latest
    container_name: polidoc_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["--auth"]
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 300M

  # 4. Mongo Express (Panel Web visual opcional para ver los logs en MongoDB)
  mongo_express:
    image: mongo-express:latest
    container_name: polidoc_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb

  # 5. Django 6.0 Web (Usando SQLite)
  web:
    build: .
    container_name: polidoc_web
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
      - ./data:/data
    ports:
      - "8001:8001"
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
    depends_on:
      - rabbitmq
      - redis
      - mongodb
      - mailpit
    deploy:
      resources:
        limits:
          memory: 400M

  # 6. Celery Worker (Procesador de tareas asíncronas)
  celery_worker:
    build: .
    container_name: polidoc_celery_worker
    command: celery -A polidoc worker --loglevel=info
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
    depends_on:
      - rabbitmq
      - redis
      - mongodb
      - web
      - mailpit

  # 6b. Celery Beat (Programador de tareas periódicas) — debe correr UNA sola instancia
  celery_beat:
    build: .
    container_name: polidoc_celery_beat
    command: celery -A polidoc beat --loglevel=info --schedule=/data/celerybeat-schedule
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
    depends_on:
      - rabbitmq
      - redis
      - mongodb
      - web
      - mailpit

  # 7. Mailpit (SMTP de captura para desarrollo)
  mailpit:
    image: axllent/mailpit
    container_name: polidoc_mailpit
    restart: always
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web -> http://localhost:8025

volumes:
  rabbitmq_data:
  redis_data:
  mongodb_data:
  data: