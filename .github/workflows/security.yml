name: Seguridad

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de sistema (python-ldap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Instalar dependencias (con hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pip-audit

      - name: Escaneo de vulnerabilidades (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Django check
        run: python manage.py check --settings=polidoc.test_settings

      - name: Tests
        run: python manage.py test auditoria documentos autenticacion --settings=polidoc.test_settings

      - name: Detectar archivos .pth inesperados
        run: |
          python -c "
          import pathlib, sys
          sp = pathlib.Path(sys.prefix) / 'lib' / f'python{sys.version_info.major}.{sys.version_info.minor}' / 'site-packages'
          allow = {'distutils-precedence.pth'}
          bad = sorted(p.name for p in sp.glob('*.pth') if p.name not in allow)
          if bad:
              sys.exit('Archivos .pth inesperados: ' + ', '.join(bad))
          print('OK: sin .pth inesperados')
          "
